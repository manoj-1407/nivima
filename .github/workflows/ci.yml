name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libsndfile1

      - name: Install CI deps only
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
          pip install pydantic==2.8.2 pydantic-settings==2.4.0
          pip install sqlalchemy==2.0.32 fastapi==0.115.0
          pip install python-jose[cryptography]==3.3.0 passlib[bcrypt]==1.7.4 bcrypt==4.0.1
          pip install numpy soundfile librosa scipy
          pip install opencv-python-headless
          pip install boto3==1.35.22
          pip install httpx==0.27.2 python-multipart==0.0.9
          pip install structlog==24.4.0 tenacity==9.0.0
          pip install aiofiles==24.1.0 python-dotenv==1.0.1

      - name: Lint with ruff
        run: python -m ruff check src/ tests/ --ignore E501

      - name: Run fast unit tests
        run: python -m pytest tests/unit/ -v --tb=short
        env:
          DATABASE_URL: postgresql://nivima:password@localhost:5432/nivima
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: nivima-test
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          JWT_SECRET: test_secret_minimum_32_characters_long_here
          GPU_AVAILABLE: "false"
          GPU_DEVICE: cpu
          MODEL_CACHE_DIR: /tmp/models
          ENVIRONMENT: test
          OLLAMA_URL: http://localhost:11434

      - name: Run API integration tests
        run: python -m pytest tests/integration/test_api.py -v --tb=short
        env:
          DATABASE_URL: postgresql://nivima:password@localhost:5432/nivima
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: nivima-test
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          JWT_SECRET: test_secret_minimum_32_characters_long_here
          GPU_AVAILABLE: "false"
          GPU_DEVICE: cpu
          MODEL_CACHE_DIR: /tmp/models
          ENVIRONMENT: test
          OLLAMA_URL: http://localhost:11434
