name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov
          pip install pydantic pydantic-settings sqlalchemy fastapi httpx
          pip install librosa soundfile numpy opencv-python-headless

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run unit tests (no GPU, no models required)
        run: |
          pytest tests/unit/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            -x \
            --ignore=tests/unit/test_tts.py \
            --ignore=tests/unit/test_scene_classifier.py
        env:
          DATABASE_URL: postgresql://voxbridge:password@localhost:5432/voxbridge
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: voxbridge-test
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          JWT_SECRET: test_secret_minimum_32_characters_long
          GPU_AVAILABLE: "false"
          GPU_DEVICE: cpu
          MODEL_CACHE_DIR: /tmp/models
          ENVIRONMENT: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f infra/docker/Dockerfile.api -t voxbridge-api:${{ github.sha }} .

      - name: Build Worker Docker image
        run: docker build -f infra/docker/Dockerfile.worker -t voxbridge-worker:${{ github.sha }} .
